name: GPX route replay

on:
  push:
    branches: [ultimate-gpx-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -PcoreOnly :core:jvmTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpx-replay-results
          path: android/core/build/test-results/jvmTest
