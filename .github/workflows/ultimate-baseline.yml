name: Ultimate upstream baseline
on:
  push:
    branches: [ultimate-baseline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 779daee0cf7685ffdaea733cd60b38a4c978b672
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -PcoreOnly :core:jvmTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-core-results
          path: android/core/build/test-results/jvmTest
  iphone:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 779daee0cf7685ffdaea733cd60b38a4c978b672
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          xcodebuild -version
          xcodebuild -showsdks
          brew install xcodegen
      - run: .github/ios/shared-app.sh release
      - run: xcodegen generate
      - run: xcodebuild -project Kite.xcodeproj -scheme Kite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - run: lipo -verify_arch arm64 build/Build/Products/Release-iphoneos/Kite.app/Kite
